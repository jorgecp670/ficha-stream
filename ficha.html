<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem Automatizada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Ficha de Personagem - Sistema de Save</h1>

        <!-- Input para upload de imagem do personagem -->
        <label class="picture" for="picture__input" tabindex="0">
            <span class="picture__image">Clique para adicionar imagem</span>
        </label>
        <input type="file" name="picture__input" id="picture__input" accept="image/*">

        <form id="characterForm">
            <h2>Dados do Personagem</h2>
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required>

            <label for="characterClass">Classe:</label>
            <input type="text" id="characterClass" name="characterClass" required>

            <label for="region">Região (Origem):</label>
            <input type="text" id="region" name="region" required>

            <label for="faith">Fé:</label>
            <input type="text" id="faith" name="faith" required>

            <label for="background">Antecedente:</label>
            <input type="text" id="background" name="background" required>

            <label for="ageReal">Idade (real):</label>
            <input type="number" id="ageReal" name="ageReal" min="0" required>

            <label for="ageApparent">Idade (aparente):</label>
            <input type="number" id="ageApparent" name="ageApparent" min="0" required>

            <h2>Atributos</h2>
            <div class="attributes">
                <div>
                    <label for="strength">FORÇA:</label>
                    <input type="number" id="strength" name="strength" min="0" required>
                </div>
                <div>
                    <label for="agility">AGILIDADE:</label>
                    <input type="number" id="agility" name="agility" min="0" required>
                </div>
                <div>
                    <label for="wisdom">SABEDORIA:</label>
                    <input type="number" id="wisdom" name="wisdom" min="0" required>
                </div>
                <div>
                    <label for="intelligence">INTELIGÊNCIA:</label>
                    <input type="number" id="intelligence" name="intelligence" min="0" required>
                </div>
                <div>
                    <label for="luck">SORTE:</label>
                    <input type="number" id="luck" name="luck" min="0" required>
                </div>
                <div>
                    <label for="adaptability">ADAPTABILIDADE:</label>
                    <input type="number" id="adaptability" name="adaptability" min="0" required>
                </div>
                <div>
                    <label for="charisma">CARISMA:</label>
                    <input type="number" id="charisma" name="charisma" min="0" required>
                </div>
            </div>

            <h2>Habilidades</h2>
            <div class="abilities">
                <div>
                    <label for="ability1">Habilidade 1:</label>
                    <input type="text" id="ability1" name="ability1" required>
                </div>
                <div>
                    <label for="ability2">Habilidade 2:</label>
                    <input type="text" id="ability2" name="ability2" required>
                </div>
            </div>

            <h2>Dados</h2>
            <button type="button" onclick="rollDice()">Rolar Dados</button>
            <div id="diceResult">Resultado:</div>

            <button type="submit">Salvar Ficha</button>
        </form>
        <div id="successMessage" style="display: none;">Ficha salva com sucesso!</div>
        <div id="errorMessage" style="display: none;">Erro ao salvar a ficha. Por favor, tente novamente.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
